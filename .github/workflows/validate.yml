name: validate
on: [push, pull_request]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog.json
        run: |
          python3 - <<'PY'
          import json, re, sys
          catalog = json.load(open("catalog.json"))
          errors = []
          if catalog.get("version") != 1:
              errors.append("version must be 1")
          seen = set()
          for i, p in enumerate(catalog.get("plugins", [])):
              where = p.get("id", f"#{i}")
              for key in ("id", "name", "version", "url", "sha256", "permissions", "engines"):
                  if key not in p:
                      errors.append(f"{where}: missing {key}")
              pid = p.get("id", "")
              if not re.fullmatch(r"[a-z0-9]+(\.[a-z0-9-]+)+", pid) or pid.startswith("uncia."):
                  errors.append(f"{where}: bad id")
              if pid in seen:
                  errors.append(f"{where}: duplicate id")
              seen.add(pid)
              if not str(p.get("url", "")).startswith("https://"):
                  errors.append(f"{where}: url must be https")
              if not re.fullmatch(r"[0-9a-f]{64}", str(p.get("sha256", ""))):
                  errors.append(f"{where}: sha256 must be 64 lowercase hex characters")
          print("\n".join(errors) or f"ok: {len(seen)} plugins")
          sys.exit(1 if errors else 0)
          PY
